# ==============================================================================
# TCMB EVDS Serileri İndirme Yönergesi (Series Ingestion Manifest)
# ==============================================================================
# Bu dosya, F-001 kapsamında Bronze katmanına (data/bronze/evds/{code}.json)
# kaynaktan ham olarak indirilecek serilerin bildirimsel kaydıdır.
#
# İdempotency Kuralı: Dosya diskte mevcutsa ve boyutu > 0 ise indirme atlanır (skip).
# Tarih Aralığı: Hackathon şartnamesi gereği 01-01-2021 / 01-06-2026.
#
# Durum: Tüm seriler data/bronze/evds/evds_catalog.parquet taranarak
# %100 resmi EVDS kodlarıyla doğrulanmış ve kilitlenmiştir.
# ==============================================================================

version: "2.0"
default_start_date: "01-01-2021"
default_end_date: "01-06-2026"

